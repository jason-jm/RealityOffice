<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reality Office uses an R in the colours of Pages, Slides and Sheets.
  The mark fits the adaptive icon's safe circle. Drawn in a 1024 box, rendered at 1424 × 1424 to
  app/src/main/res/drawable-nodpi/ic_launcher_foreground.png by tools/icons/make-app-icon.sh. The same geometry is in
  ui/AeroDesk.kt (the home screen's mark) and res/drawable/ic_launcher_monochrome.xml.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECF0F7"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#134A9C"/>
      <stop offset="1" stop-color="#3B80E6"/>
    </linearGradient>
    <linearGradient id="slides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A83218"/>
      <stop offset="1" stop-color="#EC6A3D"/>
    </linearGradient>
    <linearGradient id="sheets" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B6434"/>
      <stop offset="1" stop-color="#25A75C"/>
    </linearGradient>
    <clipPath id="r">
      <path clip-rule="evenodd" d="M292 278 Q292 252 318 252 H522 C650 252 724 319 724 417 C724 487 690 540 626 570 L742 739 Q754 756 733 756 H632 Q621 756 614 746 L501 584 H414 V756 H318 Q292 756 292 730 Z M414 358 V478 H518 C572 478 606 459 606 417 C606 377 574 358 518 358 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B2A4A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <g filter="url(#shadow)">
    <g clip-path="url(#r)">
      <rect x="292" y="252" width="462" height="156" fill="url(#pages)"/>
      <rect x="292" y="424" width="462" height="158" fill="url(#slides)"/>
      <rect x="292" y="598" width="462" height="158" fill="url(#sheets)"/>
    </g>
  </g>
</svg>
