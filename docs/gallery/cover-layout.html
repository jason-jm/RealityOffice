<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Office for PICO Space Pro · Product posters</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --sans: "Helvetica Neue", Arial, sans-serif;
      --serif: "STIX Two Text", Georgia, serif;
    }
    body { margin: 0; background: #e6e3db; font-family: var(--sans); }
    main { max-width: 1640px; margin: 0 auto; container-type: inline-size; }
    figure, h1, h2, p { margin: 0; }
    img { display: block; }
    main > * + * { margin-top: 24px; }
    main:has(> :target) > :not(:target) { display: none; }
    main > :target { margin-top: 0; }

    main:has(> #cover:target) { max-width: 1800px; }
    .cover { position: relative; aspect-ratio: 2; overflow: hidden; }
    .cover-spread {
      position: absolute;
      inset: 0 auto auto 0;
      display: grid;
      grid-template-columns: 590px 1210px;
      width: 1800px;
      height: 900px;
      color: #172f46;
      background: #f6f1e9;
      transform-origin: top left;
      transform: scale(calc(100cqw / 1800px));
    }
    .cover .intro { padding: 55px 45px 52px 58px; display: flex; flex-direction: column; }
    .cover .brand { display: flex; align-items: center; gap: 15px; font-size: 23px; font-weight: 600; }
    .cover .icon { width: 48px; height: 48px; overflow: hidden; border-radius: 11px; background: white; }
    .cover .icon img { display: inline; width: 70px; max-width: none; margin: -12px 0 0 -11px; }
    .cover h1 { margin: 57px 0 0 -6px; font-size: 138px; line-height: .85; letter-spacing: -.08em; }
    .cover h1 span { display: block; }
    .cover h1 span + span { margin-top: 8px; }
    .cover .platform { margin: 30px 0 0; font-size: 45px; line-height: 1.12; letter-spacing: -.045em; }
    .cover .platform strong { font-weight: 650; }
    .cover .thumbnails { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; margin-top: auto; }
    .cover .thumbnails img { display: block; width: 100%; height: auto; border-radius: 7px; }
    .cover figcaption { display: flex; align-items: center; gap: 8px; font-size: 18px; margin-top: 13px; }
    .cover figcaption strong { font-weight: 650; }
    .cover .detail { color: #385067; }
    .cover .slide-feature { background: #182f49; color: #faf6e9; padding: 45px 44px; display: flex; flex-direction: column; justify-content: center; }
    .cover .slide-feature img { width: 100%; height: auto; display: block; border-radius: 12px; }
    .cover .slide-feature figcaption { margin-top: 22px; font-size: 23px; justify-content: space-between; }
    .cover .record { font-weight: 400; color: #c6d5dd; font-size: 20px; }

    .feature {
      position: relative;
      isolation: isolate;
      padding: 2.85cqw 4.268292683cqw 3.35cqw;
      color: var(--ink);
      background: var(--paper);
    }
    .feature::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: url("print-texture.webp") center / cover;
      mix-blend-mode: luminosity;
      opacity: .065;
    }
    #home { --paper: #f6efdf; --ink: #213e4b; }
    #pages { --paper: #e2ecfa; --ink: #214478; }
    #sheets { --paper: #e3efe3; --ink: #205441; }
    #slides { --paper: #fae6d7; --ink: #833f29; }
    .feature figcaption {
      display: flex;
      align-items: baseline;
      gap: 1.6cqw;
      margin-bottom: 1.85cqw;
    }
    .feature h2 { font: 500 6.15cqw/.95 var(--serif); letter-spacing: -.055em; }
    .feature figcaption::after {
      content: "";
      flex: 1;
      align-self: center;
      margin-top: .9cqw;
      height: .09cqw;
      background: currentColor;
      opacity: .35;
    }
    .feature figcaption p {
      order: 1;
      font-size: 2.65cqw;
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: -.035em;
    }
    .feature > img {
      width: 100%;
      height: auto;
      box-shadow: 0 0 0 1px rgb(22 37 38 / 22%), 0 .38cqw 1.1cqw rgb(24 37 36 / 12%);
    }
  </style>
</head>
<body>
  <main>
    <section class="cover" id="cover" aria-label="Reality Office for PICO Space Pro">
      <div class="cover-spread">
        <section class="intro" aria-label="Reality Office">
          <div class="brand"><span class="icon"><img src="../../tools/icons/app-icon.svg" alt=""></span>Spatial office suite</div>
          <h1><span>Reality</span><span>Office</span></h1>
          <p class="platform">Built for<br><strong>PICO Space Pro</strong></p>
          <div class="thumbnails">
            <figure><img src="en/pages.webp" alt="The studio schedule in Pages"><figcaption><strong>Pages</strong><span class="detail">/ Run sheet</span></figcaption></figure>
            <figure><img src="en/sheets.webp" alt="The club materials budget in Sheets"><figcaption><strong>Sheets</strong><span class="detail">/ Budget</span></figcaption></figure>
          </div>
        </section>
        <figure class="slide-feature">
          <img src="en/slides.webp" alt="The Saturday Print Club welcome deck in Slides">
          <figcaption><span><strong>Slides</strong> / Saturday Print Club</span><span class="record">PICO OS 6.2 emulator</span></figcaption>
        </figure>
      </div>
    </section>

    <figure class="feature" id="home">
      <figcaption><h2>Home</h2><p>Start from a template</p></figcaption>
      <img src="en/home.webp" alt="Blank files, templates and recently opened Saturday Print Club files">
    </figure>
    <figure class="feature" id="pages">
      <figcaption><h2>Pages</h2><p>Lay out a studio schedule</p></figcaption>
      <img src="en/pages.webp" alt="The print club run sheet with a table of times, activities and locations">
    </figure>
    <figure class="feature" id="sheets">
      <figcaption><h2>Sheets</h2><p>Track a materials budget</p></figcaption>
      <img src="en/sheets.webp" alt="A materials budget with quantities, prices, a total and the funds left">
    </figure>
    <figure class="feature" id="slides">
      <figcaption><h2>Slides</h2><p>Design a welcome deck</p></figcaption>
      <img src="en/slides.webp" alt="The Saturday Print Club welcome slide and three slide thumbnails">
    </figure>
  </main>
</body>

-->
</html>
