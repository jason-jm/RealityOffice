<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Office for PICO Space Pro</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1800px; height: 900px; margin: 0; overflow: hidden; }
    body { background: #f6f1e9; color: #172f46; font-family: "Helvetica Neue", Arial, sans-serif; }
    main { display: grid; grid-template-columns: 590px 1210px; height: 100%; }
    .intro { padding: 55px 45px 52px 58px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 15px; font-size: 23px; font-weight: 600; }
    .icon { width: 48px; height: 48px; overflow: hidden; border-radius: 11px; background: white; }
    .icon img { width: 70px; max-width: none; margin: -12px 0 0 -11px; }
    h1 { margin: 57px 0 0 -6px; font-size: 138px; line-height: .85; letter-spacing: -.08em; }
    h1 span { display: block; }
    h1 span + span { margin-top: 8px; }
    .platform { margin: 30px 0 0; font-size: 45px; line-height: 1.12; letter-spacing: -.045em; }
    .platform strong { font-weight: 650; }
    .thumbnails { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; margin-top: auto; }
    figure { margin: 0; }
    .thumbnails img { display: block; width: 100%; height: auto; border-radius: 7px; }
    figcaption { display: flex; align-items: center; gap: 8px; font-size: 18px; margin-top: 13px; }
    figcaption strong { font-weight: 650; }
    .detail { color: #385067; }
    .feature { background: #182f49; color: #faf6e9; padding: 45px 44px; display: flex; flex-direction: column; justify-content: center; }
    .feature img { width: 100%; height: auto; display: block; border-radius: 12px; }
    .feature figcaption { margin-top: 22px; font-size: 23px; justify-content: space-between; }
    .record { font-weight: 400; color: #c6d5dd; font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-label="Reality Office">
      <div class="brand"><span class="icon"><img src="../../tools/icons/app-icon.svg" alt=""></span>Spatial office suite</div>
      <h1><span>Reality</span><span>Office</span></h1>
      <p class="platform">Built for<br><strong>PICO Space Pro</strong></p>
      <div class="thumbnails">
        <figure><img src="en/pages.webp" alt="The studio schedule in Pages"><figcaption><strong>Pages</strong><span class="detail">/ Run sheet</span></figcaption></figure>
        <figure><img src="en/sheets.webp" alt="The club materials budget in Sheets"><figcaption><strong>Sheets</strong><span class="detail">/ Budget</span></figcaption></figure>
      </div>
    </section>
    <figure class="feature">
      <img src="en/slides.webp" alt="The Saturday Print Club welcome deck in Slides">
      <figcaption><span><strong>Slides</strong> / Saturday Print Club</span><span class="record">PICO OS 6.2 emulator</span></figcaption>
    </figure>
  </main>
</body>
</html>
