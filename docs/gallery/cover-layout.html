<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Office for PICO Space Pro · Product posters</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --sans: "Helvetica Neue", Arial, sans-serif;
      --serif: "STIX Two Text", Georgia, serif;
    }
    body { margin: 0; background: #e6e3db; font-family: var(--sans); }
    main { max-width: 1640px; margin: 0 auto; container-type: inline-size; }
    figure, h1, h2, p { margin: 0; }
    img { display: block; }
    main > * + * { margin-top: 24px; }
    main:has(> :target) > :not(:target) { display: none; }
    main > :target { margin-top: 0; }

    .cover {
      padding: 2.2cqw 2.3cqw 2.5cqw;
      color: #fff7e8;
      background: #102c40 url("print-texture.webp") left bottom / cover;
    }
    .introduction {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2cqw;
      padding-bottom: 1.3cqw;
      margin-bottom: 1.25cqw;
      border-bottom: 1px solid rgb(241 238 222 / 45%);
    }
    .cover-brand { display: flex; align-items: center; gap: 1.25cqw; }
    .mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 4.1cqw;
      height: 4.1cqw;
      border-radius: .8cqw;
      overflow: hidden;
      background: #fff;
    }
    .mark img { width: 140%; flex: none; }
    .cover h1 {
      font: 500 5.85cqw/1 var(--serif);
      letter-spacing: -.055em;
      white-space: nowrap;
    }
    .cover h1 em { font-weight: 400; }
    .platform { font-size: 1.5cqw; line-height: 1.12; text-align: right; }
    .platform strong {
      display: block;
      font-size: 2.2cqw;
      font-weight: 600;
      white-space: nowrap;
    }
    .screens {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.6cqw 1.5cqw;
      align-items: start;
    }
    .screens figcaption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: .5cqw;
      padding: 0 .1cqw .5cqw;
    }
    .screens strong { font-size: 2.25cqw; font-weight: 600; letter-spacing: -.04em; }
    .screens span { color: #d5e2e9; font-size: 1.48cqw; }
    .proof {
      aspect-ratio: 1.56;
      overflow: hidden;
      border: .16cqw solid #e6dece;
      background: #e6dece;
      box-shadow: 0 .3cqw .8cqw rgb(0 12 25 / 30%);
    }
    .proof img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.035); }
    .home-proof img { transform: scale(1.11); }

    @container (max-width: 600px) {
      .cover { padding: 3.6cqw 3.1cqw 4cqw; }
      .introduction { margin-bottom: 2.5cqw; padding-bottom: 2.4cqw; }
      .cover-brand { gap: 1.5cqw; }
      .mark { width: 6.2cqw; height: 6.2cqw; border-radius: 1.15cqw; }
      .cover h1 { font-size: 8.15cqw; }
      .platform { font-size: 2.6cqw; }
      .platform strong { font-size: 3.5cqw; }
      .screens { grid-template-columns: 1fr; gap: 3.3cqw; }
      .screens figcaption { padding-bottom: 1.15cqw; }
      .screens strong { font-size: 5.05cqw; }
      .screens span { font-size: 3.25cqw; }
      .proof { border-width: .33cqw; }
    }

    .feature {
      position: relative;
      isolation: isolate;
      padding: 2.85cqw 4.268292683cqw 3.35cqw;
      color: var(--ink);
      background: var(--paper);
    }
    .feature::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: url("print-texture.webp") center / cover;
      mix-blend-mode: luminosity;
      opacity: .065;
    }
    #home { --paper: #f6efdf; --ink: #213e4b; }
    #pages { --paper: #e2ecfa; --ink: #214478; }
    #sheets { --paper: #e3efe3; --ink: #205441; }
    #slides { --paper: #fae6d7; --ink: #833f29; }
    .feature figcaption {
      display: flex;
      align-items: baseline;
      gap: 1.6cqw;
      margin-bottom: 1.85cqw;
    }
    .feature h2 { font: 500 6.15cqw/.95 var(--serif); letter-spacing: -.055em; }
    .feature figcaption::after {
      content: "";
      flex: 1;
      align-self: center;
      margin-top: .9cqw;
      height: .09cqw;
      background: currentColor;
      opacity: .35;
    }
    .feature figcaption p {
      order: 1;
      font-size: 2.65cqw;
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: -.035em;
    }
    .feature > img {
      width: 100%;
      height: auto;
      box-shadow: 0 0 0 1px rgb(22 37 38 / 22%), 0 .38cqw 1.1cqw rgb(24 37 36 / 12%);
    }
  </style>
</head>
<body>
  <main>
    <section class="cover" id="cover" aria-labelledby="title">
      <header class="introduction">
        <div class="cover-brand">
          <span class="mark"><img src="../../tools/icons/app-icon.svg" alt=""></span>
          <h1 id="title">Reality <em>Office</em></h1>
        </div>
        <p class="platform">Built for <strong>PICO Space Pro</strong></p>
      </header>
      <div class="screens">
        <figure>
          <figcaption><strong>Home</strong><span>File library</span></figcaption>
          <div class="proof home-proof"><img src="en/home.webp" alt="Templates and recent files on the home screen"></div>
        </figure>
        <figure>
          <figcaption><strong>Pages</strong><span>Documents</span></figcaption>
          <div class="proof"><img src="en/pages.webp" alt="The Saturday Print Club run sheet in Pages"></div>
        </figure>
        <figure>
          <figcaption><strong>Sheets</strong><span>Spreadsheets</span></figcaption>
          <div class="proof"><img src="en/sheets.webp" alt="The club’s materials budget in Sheets"></div>
        </figure>
        <figure>
          <figcaption><strong>Slides</strong><span>Presentations</span></figcaption>
          <div class="proof"><img src="en/slides.webp" alt="A welcome slide featuring Hokusai’s Great Wave"></div>
        </figure>
      </div>
    </section>

    <figure class="feature" id="home">
      <figcaption><h2>Home</h2><p>Start from a template</p></figcaption>
      <img src="en/home.webp" alt="Blank files, templates and recently opened Saturday Print Club files">
    </figure>
    <figure class="feature" id="pages">
      <figcaption><h2>Pages</h2><p>Lay out a studio schedule</p></figcaption>
      <img src="en/pages.webp" alt="The print club run sheet with a table of times, activities and locations">
    </figure>
    <figure class="feature" id="sheets">
      <figcaption><h2>Sheets</h2><p>Track a materials budget</p></figcaption>
      <img src="en/sheets.webp" alt="A materials budget with quantities, prices, a total and the funds left">
    </figure>
    <figure class="feature" id="slides">
      <figcaption><h2>Slides</h2><p>Design a welcome deck</p></figcaption>
      <img src="en/slides.webp" alt="The Saturday Print Club welcome slide and three slide thumbnails">
    </figure>
  </main>
</body>
<!--
  The paper texture was generated with OpenAI's built-in image generation tool.
  Create a wide landscape background texture for a set of editorial software posters inspired by a printmaking studio. Make a full-bleed scan of a midnight Prussian-blue ink monotype on fine cotton paper. A few broad, gently curving cobalt brayer marks rise from the lower left edge. Keep the upper half and the entire right half dark and quiet, with subtle paper tooth and plenty of space for lettering and screenshots to be added later. Two blue inks only. No text, objects, screens, symbols, borders or watermarks.
-->
</html>
