name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (with undo-delta verification)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Lint (warnings are errors)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Minified release build (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
